- coord: "39.955445839523016, -75.15671822478048"
  name: "Dim Sum Garden"
  date: "2025/10/11"
  review: "Ordered the Shanghai Steamed Pork Soup Dumplings, Pork Wonton with Chili Oil, Sticky Rice & Pork Shao Mai, Shrimp & Pork Shao Mai, and Beff Ho Fun. The only thing good was the Stick Rice & Pork Shao Mai. The Shrimp & Pork Shao Mai has loose wrapper and couldn't taste the shrimp. The Pork Wonton with Chili Oil doesn't even taste authentic, it was vinegary and bland. Shanghai Steamed Pork Soup Dumplings taste like frozen dumplings, the soup and skin were both cold and unflavorful."
  rating: 1
